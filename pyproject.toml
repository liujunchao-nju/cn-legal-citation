[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-legal-citation"
version = "0.1.0"
description = "按《法学引注手册》(第二版)生成中文法学脚注"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "刘俊超", email = "251820244@smail.nju.edu.cn" }]
keywords = ["legal citation", "法学引注", "footnote", "中国法", "legal writing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Legal Industry",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/liujunchao/cn-legal-citation"
Issues = "https://github.com/liujunchao/cn-legal-citation/issues"

[project.scripts]
cn-legal-citation = "cn_legal_citation.cli:main"

[tool.setuptools]
packages = ["cn_legal_citation"]

[tool.setuptools.package-data]
cn_legal_citation = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
