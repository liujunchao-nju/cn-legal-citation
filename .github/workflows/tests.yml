name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          python -m cn_legal_citation types
          python -m cn_legal_citation cite --type book --file examples/book.json
          python -m cn_legal_citation batch --file examples/samples.json
          python -m cn_legal_citation parse --text "王名扬:《美国行政法》,中国法制出版社1995年版,第18页。"
          python -m cn_legal_citation check --text "张新宝:《侵权责任法》,中国人民大学出版社2020年版。"

      - name: Build the skill and run its self-check
        run: |
          python tools/build_skill.py --target "$RUNNER_TEMP/skill"
          python "$RUNNER_TEMP/skill/scripts/selfcheck.py"
