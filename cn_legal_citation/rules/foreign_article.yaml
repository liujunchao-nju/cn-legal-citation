type: foreign_article
label: 外文论文（英文）
description: 英文等外文期刊论文
source: 《法学引注手册》(第二版)外文引注体例一般规范（作者名、文献名、期刊名第一次出现时写全名）
examples:
  - Cass R. Sunstein, Interpreting Statutes in the Regulatory State, 103 Harvard Law Review 405 (1989).
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
      et_al: " et al."
  title:
    type: plain
  journal:
    type: plain
  volume:
    type: plain
  first_page:
    type: plain
  year:
    type: plain
segments:
  - text: "{authors}, "
    requires: [authors]
  - text: "{title}, "
    requires: [title]
  - text: "{volume} {journal} {first_page}"
    requires: [volume, journal]
  - text: " ({year})"
    requires: [year]
  - text: "."
