type: wechat
label: 微信公众号文章
description: 微信公众号发布的文章
source: 《法学引注手册》(第二版)第 56 条：引用微信公众号上的文章，不再要求标注网页链接
examples:
  - 刘松山:《失信惩戒立法的三大问题》,载微信公众号“中国法律评论”2019年11月19日。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
  title:
    type: plain
  account:
    type: plain
  year:
    type: plain
  month:
    type: plain
  day:
    type: plain
  date:
    type: date_cn
    from: [year, month, day]
segments:
  - text: "{authors}{colon}"
    requires: [authors]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}载微信公众号“{account}”{date}"
    requires: [account]
  - text: "。"
