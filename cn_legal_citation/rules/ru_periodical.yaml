type: ru_periodical
label: 俄文报刊
description: 俄文报刊文章。报刊文章题目斜体，附报纸名称和日期
source: 《法学引注手册》(第二版)第 138 条
examples:
  - Ольга М. Игнатова, Юрист Хрусталева разъяснила, могут ли граждане-банкроты выезжать за границу, Российская газета, 06.02.2024.
  - 'Шварцман Валентина, От дисбаланса к диверсификации: эксперты РСПП оценили перспективы российско-индийского экономического сотрудничества, РБК, 31.01.2024, at 01.'
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
      et_al: " и др."
      sep: ", "
      sep_two: " и "
      sep_last: " и "
  title:
    type: plain
  newspaper:
    type: plain
  date:
    type: plain
  page:
    type: plain
segments:
  - text: "{authors}, "
    requires: [authors]
  - text: "{title}, "
    requires: [title]
  - text: "{newspaper}, "
    requires: [newspaper]
  - text: "{date}"
    requires: [date]
  - text: ", {page}"
    requires: [page]
  - text: "."
