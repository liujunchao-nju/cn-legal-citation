type: journal
label: 期刊论文
description: 刊登于学术期刊的论文；新闻周刊等杂志可用 issue_date 括注刊发时间
source: 《法学引注手册》(第二版)第 43 条（学术期刊的出版信息）、第 45 条（报纸杂志的出版信息）；《法律科学》编辑部 2021 年执行公告第 7 条
examples:
  - 季卫东:《法律程序的意义——对中国法制建设的另一种思考》,载《中国社会科学》1993年第1期,第91页。
  - 崔国斌:《知识产权法官造法批判》,载《中国法学》2006年第1期,第163页。
  - 王和岩:《邓玉娇案尘埃落定》,载《财经》2009年第13期（2009年6月22日）。
  - 《台大法学论丛》第47卷第4期（2018年）。
  - 苏力、于明:《基于中国经验的学术创造——苏力教授访谈》,载《学术月刊》2020年第3期。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
  authorship:
    type: authorship
  title:
    type: plain
  journal:
    type: plain
  year:
    type: plain
  volume:
    type: plain
  issue:
    type: plain
  issue_info:
    type: issue_info
    from: [year, volume, issue]
  issue_date:
    type: plain
  pages:
    type: page_range
segments:
  - text: "{authors}{authorship}{colon}"
    requires: [authors]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}载《{journal}》"
    requires: [journal, title]
  - text: "《{journal}》"
    requires: [journal]
    absent: [title]
  - text: "{issue_info}"
    requires: [issue_info]
  - text: "（{issue_date}）"
    requires: [issue_date]
  - text: "{comma}{pages}"
    requires: [pages]
  - text: "。"
