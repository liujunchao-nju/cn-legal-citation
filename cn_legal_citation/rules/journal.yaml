type: journal
label: 期刊论文
description: 刊登于期刊、集刊的论文
source: 《法学引注手册》(第二版)示例〔5〕；《法律科学》编辑部 2021 年执行公告第 7 条
examples:
  - 季卫东:《法律程序的意义——对中国法制建设的另一种思考》,载《中国社会科学》1993年第1期,第91页。
  - 张文显:《法治与国家治理现代化》,载《中国法学》2014年第4期,第18页。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
  authorship:
    type: authorship
  title:
    type: plain
  journal:
    type: plain
  year:
    type: plain
  issue:
    type: plain
  volume:
    type: plain
  publisher:
    type: publisher_year
  pages:
    type: page_range
segments:
  - text: "{authors}{authorship}{colon}"
    requires: [authors]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}载《{journal}》"
    requires: [journal]
  - text: "{year}年第{issue}期"
    requires: [year, issue]
  - text: "第{volume}卷"
    requires: [volume]
  - text: "{comma}{publisher}"
    requires: [publisher]
  - text: "{comma}{pages}"
    requires: [pages]
  - text: "。"
