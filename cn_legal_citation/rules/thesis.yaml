type: thesis
label: 学位论文
description: 硕士、博士学位论文
source: 通行格式。《法学引注手册》(第二版)未单列学位论文示例，此处按中文法学刊物通行体例实现，欢迎依据手册原文提 issue 或 PR 校正
examples:
  - 刘俊超:《论个人信息处理的正当性基础》,南京大学法学院2026年硕士学位论文,第33页。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
  title:
    type: plain
  school:
    type: plain
  year:
    type: plain
  degree:
    type: plain
  pages:
    type: page_range
segments:
  - text: "{authors}{colon}"
    requires: [authors]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}{school}{year}年{degree}学位论文"
    requires: [school, year]
  - text: "{comma}{pages}"
    requires: [pages]
  - text: "。"
