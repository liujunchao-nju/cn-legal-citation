type: thesis
label: 学位论文
description: 硕士、博士学位论文
source: 《法学引注手册》(第二版)第 64 条（标明学位授予单位、答辩年份和学位层级）；示例〔16〕
examples:
  - 李松锋:《游走在上帝与凯撒之间——美国宪法第一修正案中的政教关系研究》,中国政法大学2013年博士学位论文,第30页。
  - 刘俊超:《论个人信息处理的正当性基础》,南京大学法学院2026年硕士学位论文,第33页。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
  title:
    type: plain
  school:
    type: plain
  year:
    type: plain
  degree:
    type: plain
  pages:
    type: page_range
segments:
  - text: "{authors}{colon}"
    requires: [authors]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}{school}{year}年{degree}学位论文"
    requires: [school, year]
  - text: "{comma}{pages}"
    requires: [pages]
  - text: "。"
