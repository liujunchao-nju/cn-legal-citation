type: it_case
label: 意大利法院案例
description: 意大利法院案例。标明法院、审判庭、判决日期、判决号；刊登于杂志的标注杂志信息
source: 《法学引注手册》(第二版)第 132 条
examples:
  - Cass. civ., sez. lavoro, 29 maggio 1998, n. 5348.
  - App. Napoli, 3 novembre 2008, in Foro it., 2009, I p. 1476 s.
fields:
  court:
    type: plain
  chamber:
    type: plain
  date:
    type: plain
  number:
    type: plain
  report:
    type: plain
  year:
    type: plain
  volume:
    type: plain
  page:
    type: plain
segments:
  - text: "{court}"
    requires: [court]
  - text: ", {chamber}"
    requires: [chamber]
  - text: ", {date}"
    requires: [date]
  - text: ", n. {number}"
    requires: [number]
  - text: ", {report}"
    requires: [report]
  - text: ", {year}"
    requires: [year]
  - text: ", {volume}"
    requires: [volume]
  - text: " {page}"
    requires: [page]
  - text: "."
