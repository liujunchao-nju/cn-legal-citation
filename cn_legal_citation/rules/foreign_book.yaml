type: foreign_book
label: 外文著作（英文）
description: 英文等外文图书。尊重各该外文的一般标注法
source: 《法学引注手册》(第二版)外文引注体例一般规范（图书写明出版社，不写出版社所在城市）
examples:
  - H. L. A. Hart, The Concept of Law 123 (Oxford University Press 1961).
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
      et_al: " et al."
  title:
    type: plain
  publisher:
    type: plain
  year:
    type: plain
  pages:
    type: plain
segments:
  - text: "{authors}, "
    requires: [authors]
  - text: "{title}"
    requires: [title]
  - text: " {pages}"
    requires: [pages]
  - text: " ({publisher} {year})"
    requires: [publisher, year]
  - text: "."
