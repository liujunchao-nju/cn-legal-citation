type: en_doc_un
label: 联合国文件（英文）
description: 联合国文件的英文版本，标明机构、文件名称、编号和日期
source: 《法学引注手册》(第二版)第 111 条
examples:
  - General Assembly Resolution, Universal Declaration of Human Rights, 217A (III), 10 December 1948.
  - Security Council Resolutions, No. 338, 22 October 1973.
  - 'U.N. Secretary-General, An Agenda for Peace: Preventive Diplomacy, Peacemaking and Peace-Keeping, A/47/277, 17 June 1992.'
fields:
  organ:
    type: plain
  name:
    type: plain
  number:
    type: plain
  date:
    type: plain
segments:
  - text: "{organ}, "
    requires: [organ]
  - text: "{name}, "
    requires: [name]
  - text: "{number}, "
    requires: [number]
  - text: "{date}"
    requires: [date]
  - text: "."
