type: treaty
label: 国际公约（中文版本）
description: 国际公约的中文版本，国际组织名称一般置于书名号之前
source: 《法学引注手册》(第二版)第 85 条（无须注明译者和出版信息，必要时括注外文）
examples:
  - 联合国《儿童权利公约》。
  - 《联合国海洋法公约》(United Nations Convention on the Law of the Sea)。
fields:
  organization:
    type: plain
  name:
    type: plain
  original:
    type: plain
segments:
  - text: "{organization}"
    requires: [organization]
  - text: "《{name}》"
    requires: [name]
  - text: "({original})"
    requires: [original]
  - text: "。"
