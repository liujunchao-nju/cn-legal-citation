type: it_roman
label: 罗马法文献
description: 罗马法文献。标明片段所在文献名称与片段序号，作者可略写
source: 《法学引注手册》(第二版)第 133 条
examples:
  - Cicero, De Officiis, 3.17.71.
  - Gaius Institutiones, 3.97.
  - Gai. 3.97.
  - C. 1.3.1.
fields:
  author:
    type: plain
  work:
    type: plain
  locator:
    type: plain
segments:
  - text: "{author}, "
    requires: [author]
  - text: "{work}, "
    requires: [work]
  - text: "{locator}"
    requires: [locator]
  - text: "."
