type: internal
label: 内部资料
description: 未发表的工作报告、调研报告或口头讲话
source: 《法学引注手册》(第二版)第 62 条（注明文献产生、保管或者公开的时间、地点和方式）
examples:
  - 上海市浦东新区人民法院行政审判庭:《2001年行政庭工作总结》。
  - 全国人大常委会法工委行政诉讼法修改座谈会2009年1月21日,河南大厦(北京)。
fields:
  unit:
    type: plain
  title:
    type: plain
  meeting:
    type: plain
  year:
    type: plain
  month:
    type: plain
  day:
    type: plain
  date:
    type: date_cn
    from: [year, month, day]
  place:
    type: plain
segments:
  - text: "{unit}{colon}《{title}》"
    requires: [unit, title]
  - text: "{meeting}{date}"
    requires: [meeting]
  - text: "{comma}{place}"
    requires: [place]
  - text: "。"
