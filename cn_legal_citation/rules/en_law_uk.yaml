  number:
    type: plain
  source:
    type: plain
  url:
    type: plain
segments:
  - text: "{name}"
    requires: [name]
  - text: " {year}"
    requires: [year]
  - text: ", {section}"
    requires: [section]
  - text: ", {number}"
    requires: [number]
  - text: ", {source}"
