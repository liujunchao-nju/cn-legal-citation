type: report
label: 会议报告
description: 党代会、全国人大及其常委会等会议上的报告
source: 《法学引注手册》(第二版)第 79 条（写明报告人、报告标题、报告日期和会议名称；报告人与标题之间用冒号）
examples:
  - 李克强:《政府工作报告》,2023年3月5日在第十四届全国人民代表大会第一次会议上。
  - 习近平:《高举中国特色社会主义伟大旗帜为全面建设社会主义现代化国家而团结奋斗》,2022年10月16日在中国共产党第二十次全国代表大会上的报告。
  - 周强(最高人民法院院长):《关于〈中华人民共和国民事诉讼法(修正草案)〉的说明》,2022年12月27日在第十三届全国人大常委会第三十八次会议上,http://www.npc.gov.cn/c2/c30834/202309/t20230906_431582.html。
  - 李克强:《政府工作报告》,2023年3月5日在第十四届全国人民代表大会第一次会议上,载《国务院公报》2023年第8号。
fields:
  author:
    type: plain
  identity:
    type: plain
  title:
    type: plain
  date:
    type: plain
  meeting:
    type: plain
  report_suffix:
    type: plain
  publication:
    type: plain
segments:
  - text: "{author}{identity}{colon}"
    requires: [author]
  - text: "《{title}》"
    requires: [title]
  - text: "{comma}{date}在{meeting}上"
    requires: [date, meeting]
  - text: "{report_suffix}"
    requires: [report_suffix]
  - text: "{comma}{publication}"
    requires: [publication]
  - text: "。"
