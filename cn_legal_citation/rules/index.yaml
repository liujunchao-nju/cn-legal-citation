# 全局配置。本文件不定义文献类型，只放跨类型生效的设置。

# 标点配置。
#
# 《法学引注手册》（第二版，北京大学出版社 2025 年版）印刷示例采用半角冒号与
# 半角逗号（2026-10-15 就原书逐页核对确认），案号括号、文号括号、国籍方括号
# 同为半角，文号年份用六角括号〔〕，句号用全角。若目标刊物要求全角冒号逗号，
# 把 colon 改为 "："、comma 改为 "，" 即可，无需改动任何代码。
punctuation:
  colon: ":"
  comma: ","
  period: "。"

# 通用约定（摘自《法学引注手册》第二版相关条款）：
#
# 1. 采页下脚注；编号方式（全文连续 / 每页重新起算）由各刊物自定，
#    本工具只负责生成脚注文本本身（第 4 条）。
# 2. 同一文献多次被引用的，每次都提供完整信息，不使用"同前注 X"的略写
#    （第 13 条；再次引用的缩写方案手册不作要求，本工具亦不实现）。
# 3. 作者名后标明著作身份，默认为独著，非独著注明"主编""编著""译"等；
#    原创作品省略"著"字（第 27、28 条）。
# 4. 出版社前不标注出版社所在城市名；出版时间只写年份（第 41 条）。
# 5. 两人或三人一一列明，人数众多可列一到两位后加"等"（第 35 条）。
# 6. 期刊不标注总第期次；集刊按实际出版情况标明卷（第 43、44 条）。
# 7. 涉及法律条文条款的，条、款、项序数用阿拉伯数字，括号省略（第 70 条）。
# 8. 页码数字置于"第"和"页"中间，只写一次；连续起止用短横线，
#    不连续页码用顿号（第 48 条）。
# 9. 析出文献（期刊、报纸、图书、互联网上的文章）在来源名称前加"载"字。
# 10. 外文文献尊重各该外文的一般标注法，同时按手册作统一调整
#     （第 95-98 条）。
