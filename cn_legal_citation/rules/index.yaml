# 全局配置。本文件不定义文献类型，只放跨类型生效的设置。

# 标点配置。
#
# 《法学引注手册》（第二版）示例在多数法学期刊网页上的呈现形式为半角冒号与
# 半角逗号，故此处默认采用半角。若目标刊物要求全角，把 colon 改为 "："、
# comma 改为 "，" 即可，无需改动任何代码。
punctuation:
  colon: ":"
  comma: ","
  period: "。"

# 通用约定（摘自《法律科学》编辑部 2021 年执行《法学引注手册》标准的公告，
# 以及何海波《〈法学引注手册〉（第二版）修订说明》）：
#
# 1. 采页下脚注，注释标号置于相关语句标点之后；编号方式（全文连续 / 每页重新
#    起算）由各刊物自定，本工具只负责生成脚注文本本身。
# 2. 同一文献多次被引用的，每次都提供完整信息，不使用“同前注 X”的略写。
# 3. 作者名后标明著作身份，默认为独著，非独著注明“主编”“编著”“译”等。
# 4. 出版社前不标注出版社所在城市名。
# 5. 三人以上作品只标注第一作者，后加“等”。
# 6. 期刊不标注总第期次；集刊按实际出版情况标明卷。
# 7. 涉及法律条文条款的，序号一律用阿拉伯数字。
# 8. 外文文献尊重各该外文的一般标注法。
