type: interview
label: 访谈
description: 对访谈的引用，应征得被访谈人同意并标明时间、地点或者方式
source: 《法学引注手册》(第二版)第 60 条
examples:
  - 笔者与×××访谈,2000年3月22日,《最高人民法院公报》编辑部。
  - 笔者电话访谈,2001年3月8日。
fields:
  description:
    type: plain
  year:
    type: plain
  month:
    type: plain
  day:
    type: plain
  date:
    type: date_cn
    from: [year, month, day]
  place:
    type: plain
segments:
  - text: "{description}"
    requires: [description]
  - text: "{comma}{date}"
    requires: [date]
  - text: "{comma}{place}"
    requires: [place]
  - text: "。"
