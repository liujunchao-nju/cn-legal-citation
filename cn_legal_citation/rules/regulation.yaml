type: regulation
label: 规范性文件
description: 行政法规、部门规章以外的规范性文件；文号可用圆括号或逗号，分节可写"第×节第×小节"
source: 《法学引注手册》(第二版)第 72-76 条（一般格式第 72 条、制定机关第 73 条、文号第 74 条、分节第 75 条、出处第 76 条）
examples:
  - 《最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释》(法释〔2018〕1号),第100条。
  - 国务院发布的《打赢蓝天保卫战三年行动计划》(国发〔2018〕22号)。
  - 《国务院关于在全国建立农村最低生活保障制度的通知》(国发〔2007〕19号),第四节第一小节。
  - 《国务院关于在全国建立农村最低生活保障制度的通知》,国发〔2007〕19号。
  - 《司法部关于可否张帖判决书及应注意事项的批复》(1956年8月24日),载中华人民共和国司法部编:《中华人民共和国司法行政历史文件汇编(1950-1985)》,法律出版社1987年版,第655页。
  - 《中共中央、国务院关于实施就业优先战略促进高质量充分就业的意见》,2024年9月15日,https://www.gov.cn/zhengce/202409/content_6976469.htm。
fields:
  issuing_authority:
    type: plain
  name:
    type: titled
  document_number:
    type: document_number
  article:
    type: plain
  source_compiler:
    type: plain
  source_title:
    type: plain
  source_publisher:
    type: plain
  source_year:
    type: plain
  source_pages:
    type: page_range
  date:
    type: plain
  url:
    type: plain
segments:
  - text: "{issuing_authority}"
    requires: [issuing_authority]
  - text: "{name}"
    requires: [name]
  - text: "{document_number}"
    requires: [document_number]
  - text: "{comma}{article}"
    requires: [article]
  - text: "{comma}载{source_compiler}编:《{source_title}》,{source_publisher}{source_year}年版"
    requires: [source_compiler, source_title]
  - text: "{comma}{source_pages}"
    requires: [source_pages]
  - text: "{comma}{date}"
    requires: [date]
  - text: "{comma}{url}"
    requires: [url]
  - text: "。"
