type: taiwan_law
label: 台湾地区法律文件
description: 中国台湾地区的法律文件，应注明"我国台湾地区"或"台湾地区"，无法变通处理的加引号
source: 《法学引注手册》(第二版)第 83 条
examples:
  - 我国台湾地区“民法”。
  - 我国台湾地区“强制执行法”。
fields:
  note:
    type: plain
  name:
    type: plain
segments:
  - text: "{note}"
    requires: [note]
  - text: "“{name}”"
    requires: [name]
  - text: "。"
