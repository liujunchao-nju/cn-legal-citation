type: statistics
label: 统计数据
description: 统计数据的出处说明与检索方法（自己的调研数据应说明来源与检索方法）
source: 《法学引注手册》(第二版)第 92-94 条
examples:
  - 检索北大法宝数据库,在380余万份行政裁判文书中统计"权利"与"职权"的词频,检索时间为2024年3月,检索范围为国家法律法规数据库中的法律。
  - 参见孙乾:"民告官"信访案件年超400万件,载《京华时报》2014年11月5日,第3版。
fields:
  subject:
    type: plain
  retrieval_time:
    type: plain
  scope:
    type: plain
  keywords:
    type: plain
  method:
    type: plain
segments:
  - text: "{subject}"
    requires: [subject]
  - text: "{comma}检索时间为{retrieval_time}"
    requires: [retrieval_time]
  - text: "{comma}检索范围为{scope}"
    requires: [scope]
  - text: "{comma}检索词为{keywords}"
    requires: [keywords]
  - text: "{comma}{method}"
    requires: [method]
  - text: "。"
