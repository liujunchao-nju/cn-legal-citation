type: foreign_law
label: 外国法律（中文版本）
description: 外国法律的中文版本，国别一般置于书名号之前，可括注年份或外文原名
source: 《法学引注手册》(第二版)第 84 条；约定俗成的简称（如“美国宪法第十四修正案”）不加书名号，数据中传 plain_name 为 true
examples:
  - 英国《1996年仲裁法》。
  - 美国《统一买卖法》(1906年)。
  - 美国1906年《统一买卖法》。
  - 英国《1996年仲裁法》(Arbitration Act 1996)。
  - 美国宪法第十四修正案。
fields:
  country:
    type: plain
  year_before:
    type: plain
  name:
    type: titled
  year:
    type: plain
  original:
    type: plain
segments:
  - text: "{country}"
    requires: [country]
  - text: "{year_before}"
    requires: [year_before]
  - text: "{name}"
    requires: [name]
  - text: "({year})"
    requires: [year]
  - text: "({original})"
    requires: [original]
  - text: "。"
