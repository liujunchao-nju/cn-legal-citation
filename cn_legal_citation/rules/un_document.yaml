type: un_document
label: 联合国文件（中文版本）
description: 联合国文件，标明文件名称、通过或发布机构、文件编号和时间
source: 《法学引注手册》(第二版)第 86 条
examples:
  - 《世界人权宣言》,联合国大会决议,217A(Ⅲ),1948年12月10日通过。
  - 《全球努力打击恐怖主义的宣言》,联合国安理会决议,S/RES/1377(2001),https://www.un.org/zh/documents/treaty/S-RES-1377-2001。
  - 《和平纲领:预防性外交、建立和平与维持和平》,联合国秘书长报告,A/47/277,1992年6月17日。
fields:
  name:
    type: plain
  organ:
    type: plain
  doc_type:
    type: plain
  number:
    type: plain
  date:
    type: plain
  action:
    type: plain
  url:
    type: plain
segments:
  - text: "《{name}》"
    requires: [name]
  - text: "{comma}{organ}{doc_type}"
    requires: [organ]
  - text: "{comma}{number}"
    requires: [number]
  - text: "{comma}{date}{action}"
    requires: [date]
  - text: "{comma}{url}"
    requires: [url]
  - text: "。"
