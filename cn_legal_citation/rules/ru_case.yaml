type: ru_case
label: 俄罗斯法院案例
description: 俄罗斯法院案例。标明案件名称、案件编号、裁决日期与案例来源
source: 《法学引注手册》(第二版)第 140 条
examples:
  - Петрова против Министерства здравоохранения заявление № 54321/98765, Решение от 10 сентября 2021 года, Официальный вестник судебных решений 2021-Ⅲ.
  - Гражданин Смирнов против ООО "СтройИнвест", Дело № 24680/13579, Решение от 20 мая 2019 года, Судебные акты и решения 2019, No. 5.
fields:
  case_name:
    type: plain
  number:
    type: plain
  date:
    type: plain
  source:
    type: plain
segments:
  - text: "{case_name}"
    requires: [case_name]
  - text: ", {number}"
    requires: [number]
  - text: ", Решение от {date}"
    requires: [date]
  - text: ", {source}"
    requires: [source]
  - text: "."
