type: en_periodical
label: 英文报纸杂志
description: 英文报纸、杂志文章，出版日期采用"日-月-年"格式
source: 《法学引注手册》(第二版)第 106-107 条；示例〔25〕
examples:
  - Louis D. Brandeis, What Publicity Can Do, Harper's Weekly, 20 December 1913, p. 10.
  - Andrew Rosenthal, White House Tutors Kremlin in How a Presidency Works, New York Times, 15 June 1990, at A1.
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
      et_al: " et al."
      sep: ", "
      sep_two: " & "
      sep_last: " & "
  title:
    type: plain
  periodical:
    type: plain
  date:
    type: plain
  page:
    type: plain
segments:
  - text: "{authors}, "
    requires: [authors]
  - text: "{title}, "
    requires: [title]
  - text: "{periodical}, "
    requires: [periodical]
  - text: "{date}"
    requires: [date]
  - text: ", {page}"
    requires: [page]
  - text: "."
