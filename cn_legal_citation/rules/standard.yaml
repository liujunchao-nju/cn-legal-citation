type: standard
label: 国家标准
description: 国家标准，写明发布机关、标准名称和标准号
source: 《法学引注手册》(第二版)第 77 条
examples:
  - 国家质量监督检验检疫总局、中国国家标准化管理委员会《信息与文献参考文献著录规则》,GB/T 7714-2015。
fields:
  authority:
    type: plain
  name:
    type: plain
  number:
    type: plain
  date:
    type: plain
segments:
  - text: "{authority}"
    requires: [authority]
  - text: "《{name}》"
    requires: [name]
  - text: "{comma}{number}"
    requires: [number]
  - text: "{comma}{date}"
    requires: [date]
  - text: "。"
