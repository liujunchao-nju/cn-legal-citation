type: legal
label: 法律、法规、规章与规范性文件
description: 法律条文、司法解释、行政法规、部门规章及其他规范性文件
source: 《法学引注手册》(第二版)第 72-76 条；何海波《法学引注的三个原则》
examples:
  - 《行政处罚法》第32条。
  - 《民法典》第1224条第1款第2项。
  - 《最高人民法院关于适用〈中华人民共和国刑事诉讼法〉的解释》(法释〔2021〕1号)第100条。
  - 《全国人民代表大会常务委员会关于严禁卖淫嫖娼的决定》,1991年9月4日第七届全国人大常委会第二十一次会议通过。
fields:
  name:
    type: plain
  document_number:
    type: document_number
  article:
    type: statute_ref
  adoption_info:
    type: plain
segments:
  - text: "《{name}》"
    requires: [name]
  - text: "({document_number})"
    requires: [document_number]
  - text: "{article}"
    requires: [article]
  - text: "{comma}{adoption_info}"
    requires: [adoption_info]
  - text: "。"
