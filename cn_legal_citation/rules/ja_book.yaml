type: ja_book
label: 日文图书
description: 日文图书与编辑作品中的文章。书名加双引号『』，文章名加単引号「」，出版信息置于书名后括号内
source: 《法学引注手册》(第二版)第 143 条；示例〔32〕
examples:
  - 我妻栄『新訂担保物権法(民法講義Ⅲ)』(有斐閣,1971年)50頁。
  - 我妻栄=有泉亨『民法総論・物権法』(日本評論社,1950年)31頁。
  - 佐藤英明「一時所得の要件に関する覚書」金子宏ほか編『租税法と市場』(有斐閣,2014年)220頁。
fields:
  authors:
    type: author_list
    options:
      max_before_et_al: 3
      et_al: "ほか"
      sep: "="
  title:
    type: plain
  ja_title:
    type: ja_title
    from: [title]
  editor:
    type: plain
  container:
    type: plain
  publisher:
    type: plain
  year:
    type: plain
  pages:
    type: plain
segments:
  - text: "{authors}"
    requires: [authors]
  - text: "{ja_title}"
    requires: [title]
  - text: "{editor}編"
    requires: [editor]
  - text: "『{container}』"
    requires: [container]
  - text: "({publisher},{year}年)"
    requires: [publisher, year]
  - text: "{pages}頁"
    requires: [pages]
  - text: "。"
